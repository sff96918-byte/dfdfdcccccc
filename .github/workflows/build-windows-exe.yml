# Build ChitChatBot.exe on a real Windows machine, inside GitHub.
#
# A Windows .exe can only be built on Windows (PyInstaller cannot cross-compile),
# so this workflow does what build-exe.bat does on your own PC - step for step,
# with the same gates - and leaves the finished app as a downloadable artifact.
#
# How to use it: open the repository on GitHub -> "Actions" -> "Build Windows
# exe" -> "Run workflow". When it turns green, open the run and download the
# artifact "ChitChatBot-windows" (a zip of the whole app folder: the exe, its
# _internal folder and the README). Unzip it anywhere and double-click
# ChitChatBot.exe.
#
# If the Actions tab is not available for this repository, use build-exe.bat on
# your PC instead - it produces exactly the same folder in dist\ChitChatBot\.
#
# When a step fails, the last lines of its output are repeated as annotations
# ("::error::..."), so the failure can be read at the top of the run page and
# through the checks API even when the raw log is not reachable - and the full
# check output is kept as the "verification-output" artifact.

name: Build Windows exe

on:
  workflow_dispatch:        # the "Run workflow" button
  push:
    # main is the real target. The arena branch is listed on purpose: GitHub only
    # offers "Run workflow" and the push paths below for a workflow that exists
    # on the default branch, so this line lets the first Windows build happen
    # before the port is merged into main. Delete it after that merge.
    branches: [main, arena/8ff05787-dfdfdcccccc]
    paths:                    # only when something the exe contains changes
      - "python-port/**"
      - ".github/workflows/build-windows-exe.yml"

jobs:
  windows-exe:
    name: ChitChatBot.exe (Windows, onedir)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the build requirements
        working-directory: python-port
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Verification gate (same one build-exe.bat runs first)
        working-directory: python-port
        shell: pwsh
        run: |
          python tools/verify.py 2>&1 | Tee-Object -FilePath verify-output.txt
          $code = $LASTEXITCODE
          if ($code -eq 0) { exit 0 }
          # GitHub keeps only the last 10 annotations of a step, so send a chosen
          # few: which check failed, which unittest cases failed, the exception
          # lines and where the output ends. The raw log is not reachable from
          # every environment, so these annotations are the report.
          $lines = @(Get-Content verify-output.txt)
          $pick = @()
          $pick += "verify.py wrote $($lines.Count) line(s)"
          $pick += @($lines | Where-Object { $_.StartsWith('[FAIL]') -or $_.StartsWith('[BLOCKED]') -or $_.StartsWith('Overall:') } | Select-Object -Last 2)
          $pick += @($lines | Where-Object { $_ -match '^(FAIL|ERROR): ' } | Select-Object -First 3)
          $pick += @($lines | Where-Object { $_ -match 'Error:' -and -not ($_ -match '^(FAIL|ERROR): ') } | Select-Object -First 2)
          $pick += @($lines | Select-Object -Last 2 | ForEach-Object { "tail: $_" })
          $pick | Select-Object -First 10 | ForEach-Object { "::error::$_" }
          exit $code

      - name: Build the exe
        working-directory: python-port
        run: python -m PyInstaller build/ChitChatBot.spec --noconfirm --clean --distpath dist --workpath build/pyi

      - name: The packed app checks itself
        working-directory: python-port
        shell: pwsh
        run: |
          $output = & dist\ChitChatBot\ChitChatBot.exe --selftest 2>&1 | Out-String
          $output
          $output | Set-Content -Encoding utf8 selftest-output.txt
          if ($LASTEXITCODE -eq 0) { exit 0 }
          # The selftest is short: its own rows are the annotation.
          ($output -split "`r?`n") |
            Where-Object { $_.Trim() -ne "" } |
            Select-Object -Last 9 |
            ForEach-Object { "::error::$_" }
          exit 1

      - name: Keep the exe and its README together
        working-directory: python-port
        shell: pwsh
        run: |
          Copy-Item README.md dist\ChitChatBot\README.md -Force
          "Start the app with ChitChatBot.exe in this folder.`r`n`r`nSettings and logs are created next to it in data\\.`r`nRun 'ChitChatBot.exe --selftest' (Command Prompt) if it does not start.`r`n" |
            Set-Content -Encoding UTF8 dist\ChitChatBot\START-HERE.txt
          Get-ChildItem dist\ChitChatBot | Select-Object Name, Length

      - name: Upload the app folder
        uses: actions/upload-artifact@v4
        with:
          name: ChitChatBot-windows
          # The exe + its _internal folder + the notes. ~150-200 MB, so the
          # artifact is uploaded as a zip and the compression time is expected.
          path: |
            python-port/dist/ChitChatBot/**
            !python-port/dist/ChitChatBot/data/**
          retention-days: 30

      - name: Keep the check output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-output
          path: |
            python-port/verify-output.txt
            python-port/selftest-output.txt
          if-no-files-found: ignore
          retention-days: 7
